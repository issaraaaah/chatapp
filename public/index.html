<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #eef1f6; --panel: #ffffff; --ink: #1b2233; --muted: #6b7385;
    --line: #dde2ec; --accent: #2f4bff; --accent-ink: #ffffff; --mine: #2f4bff; --theirs: #eaeef7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f131c; --panel: #171c28; --ink: #e8ecf5; --muted: #8b94a8;
      --line: #263045; --accent: #6f86ff; --accent-ink: #0f131c; --mine: #3a52e8; --theirs: #222b3d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #login { height: 100%; display: grid; place-items: center; padding: 1rem; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 2rem; width: min(380px, 100%); }
  #login h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  #login p { margin: 0 0 1.25rem; color: var(--muted); }
  #login input { width: 100%; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  #login button { margin-top: .75rem; width: 100%; }
  #err { color: #d23b3b; min-height: 1.3em; margin: .5rem 0 0; font-size: .9rem; }

  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: .7rem 1.1rem; font-weight: 600; cursor: pointer; }

  #app { height: 100%; display: none; grid-template-columns: 220px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 1rem; overflow-y: auto; }
  aside h2 { font-size: 1rem; margin: 0 0 .75rem; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: .3rem 0; display: flex; align-items: center; gap: .5rem; }
  aside li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2fb36b; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .msg { max-width: min(70%, 520px); padding: .5rem .8rem; border-radius: 12px; background: var(--theirs); overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--mine); color: #fff; }
  .msg .meta { font-size: .75rem; color: var(--muted); margin-bottom: .1rem; }
  .msg.me .meta { color: rgba(255,255,255,.75); }
  .sys { align-self: center; color: var(--muted); font-size: .85rem; }
  #typing { height: 1.4rem; padding: 0 1rem; font-size: .85rem; color: var(--muted); }
  #composer { display: flex; gap: .5rem; padding: .75rem 1rem 1rem; border-top: 1px solid var(--line); background: var(--panel); }
  #composer input { flex: 1; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .status { font-size: .8rem; color: var(--muted); margin-top: 1rem; }

  @media (max-width: 640px) { #app { grid-template-columns: 1fr; } aside { display: none; } .msg { max-width: 85%; } }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Rejoindre le chat</h1>
    <p>Choisissez un pseudo pour commencer.</p>
    <input id="nameInput" maxlength="20" placeholder="Votre pseudo" autocomplete="off" aria-label="Pseudo" autofocus>
    <p id="err" role="alert"></p>
    <button class="btn" type="submit">Rejoindre</button>
  </form>
</div>

<div id="app">
  <aside>
    <h2>En ligne (<span id="count">0</span>)</h2>
    <ul id="users"></ul>
    <p class="status" id="status">Connecté</p>
  </aside>
  <main>
    <div id="messages" aria-live="polite"></div>
    <div id="typing"></div>
    <form id="composer">
      <input id="text" maxlength="1000" placeholder="Écrire un message" autocomplete="off" aria-label="Message">
      <button class="btn" type="submit">Envoyer</button>
    </form>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws, myName = "", typingTimer, lastTypingSent = 0;
  const typers = new Map();

  function connect(onOpen) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = onOpen;
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => {
      $("status").textContent = "Déconnecté, reconnexion…";
      if (myName) setTimeout(() => connect(() => ws.send(JSON.stringify({ type: "join", name: myName }))), 2000);
    };
  }

  function handle(m) {
    if (m.type === "error") $("err").textContent = m.text;
    if (m.type === "joined") {
      myName = m.name;
      $("login").style.display = "none";
      $("app").style.display = "grid";
      $("status").textContent = "Connecté";
      $("messages").innerHTML = "";
      m.history.forEach(addMessage);
      $("text").focus();
    }
    if (m.type === "message") { addMessage(m); typers.delete(m.name); renderTyping(); }
    if (m.type === "system") addSystem(m.text);
    if (m.type === "users") {
      $("count").textContent = m.users.length;
      $("users").innerHTML = "";
      m.users.forEach((u) => { const li = document.createElement("li"); li.textContent = u + (u === myName ? " (vous)" : ""); $("users").appendChild(li); });
    }
    if (m.type === "typing") {
      clearTimeout(typers.get(m.name));
      typers.set(m.name, setTimeout(() => { typers.delete(m.name); renderTyping(); }, 2000));
      renderTyping();
    }
  }

  function scrollDown() { const b = $("messages"); b.scrollTop = b.scrollHeight; }

  function addMessage(m) {
    const d = document.createElement("div");
    d.className = "msg" + (m.name === myName ? " me" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${m.name} à ${new Date(m.time).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
    const body = document.createElement("div");
    body.textContent = m.text; // textContent : pas d'injection HTML
    d.append(meta, body);
    $("messages").appendChild(d);
    scrollDown();
  }

  function addSystem(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = text;
    $("messages").appendChild(d);
    scrollDown();
  }

  function renderTyping() {
    const names = [...typers.keys()];
    $("typing").textContent = names.length === 0 ? "" :
      names.length === 1 ? `${names[0]} est en train d'écrire…` : "Plusieurs personnes écrivent…";
  }

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    $("err").textContent = "";
    const name = $("nameInput").value.trim();
    if (!name) return ($("err").textContent = "Entrez un pseudo.");
    const join = () => ws.send(JSON.stringify({ type: "join", name }));
    if (ws && ws.readyState === 1) join(); else connect(join);
  });

  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "message", text }));
    $("text").value = "";
  });

  $("text").addEventListener("input", () => {
    const now = Date.now();
    if (now - lastTypingSent > 1000 && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "typing" }));
      lastTypingSent = now;
    }
  });

  connect(() => {});
</script>
</body>
</html>
