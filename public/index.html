<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #f4f1ff; --panel: #ffffff; --ink: #1d1736; --muted: #7a7396; --line: #e4defa;
    --accent: #7c3aed; --grad: linear-gradient(135deg, #7c3aed, #ec4899);
    --theirs: #ffffff; --side: #1e1b4b; --side-ink: #e0dcff; --name-l: 38%;
    --online: #34d399; --shadow: 0 2px 10px rgba(80, 50, 160, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a1d; --panel: #15122b; --ink: #ece9ff; --muted: #9189b8; --line: #2a2450;
      --accent: #a78bfa; --theirs: #201b40; --side: #110e26; --name-l: 74%;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #login { height: 100%; display: grid; place-items: center; padding: 1rem;
    background: radial-gradient(circle at 15% 20%, #ec4899 0, transparent 45%),
                radial-gradient(circle at 85% 80%, #38bdf8 0, transparent 45%),
                linear-gradient(135deg, #312e81, #7c3aed); }
  #login form { background: var(--panel); border-radius: 18px; padding: 2rem; width: min(380px, 100%);
    box-shadow: 0 20px 50px rgba(20, 10, 60, .4); }
  #login h1 { margin: 0 0 .25rem; font-size: 1.6rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #login p { margin: 0 0 1.25rem; color: var(--muted); }
  #login input { width: 100%; padding: .75rem .9rem; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  #login input:focus { border-color: var(--accent); outline: none; }
  #login button { margin-top: .75rem; width: 100%; }
  #err { color: #e11d48; min-height: 1.3em; margin: .5rem 0 0 !important; font-size: .9rem; }

  .btn { background: var(--grad); color: #fff; border: 0; border-radius: 10px; padding: .75rem 1.2rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(124, 58, 237, .35); }
  .btn:hover { filter: brightness(1.08); }

  #app { height: 100%; display: none; grid-template-columns: 230px 1fr; }
  aside { background: var(--side); color: var(--side-ink); padding: 1.1rem; overflow-y: auto;
    background-image: linear-gradient(180deg, rgba(124, 58, 237, .35), transparent 35%); }
  aside h2 { font-size: 1rem; margin: 0 0 .9rem; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: .35rem 0; display: flex; align-items: center; gap: .6rem; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: #fff;
    background: linear-gradient(135deg, hsl(var(--h) 75% 55%), hsl(calc(var(--h) + 40) 75% 45%)); }
  aside .av { width: 28px; height: 28px; font-size: .8rem; box-shadow: 0 0 0 2px var(--side), 0 0 0 4px var(--online); }
  .status { font-size: .8rem; opacity: .7; margin-top: 1rem; }

  main { display: flex; flex-direction: column; min-width: 0; height: 100%;
    background: radial-gradient(circle at 10% 0%, rgba(124, 58, 237, .10), transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(236, 72, 153, .10), transparent 40%), var(--bg); }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .7rem; }
  .row { display: flex; gap: .6rem; align-items: flex-end; max-width: min(75%, 560px); }
  .row.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg { padding: .5rem .85rem; border-radius: 16px 16px 16px 4px; background: var(--theirs); box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .row.me .msg { background: var(--grad); color: #fff; border-radius: 16px 16px 4px 16px; }
  .msg audio { display: block; width: 240px; max-width: 100%; height: 40px; margin-top: .2rem; }
  .meta { font-size: .75rem; margin-bottom: .1rem; color: hsl(var(--h) 70% var(--name-l)); font-weight: 600; }
  .meta time { color: var(--muted); font-weight: 400; margin-left: .4rem; }
  .row.me .meta, .row.me .meta time { color: rgba(255, 255, 255, .8); }
  .sys { align-self: center; color: var(--muted); font-size: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .8rem; }
  #typing { height: 1.4rem; padding: 0 1rem; font-size: .85rem; color: var(--accent); font-style: italic; }

  #composer { display: flex; align-items: center; gap: .6rem; padding: .75rem 1rem 1rem; border-top: 1px solid var(--line); background: var(--panel); }
  #composer input { flex: 1; padding: .75rem 1rem; border: 2px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); }
  #composer input:focus { border-color: var(--accent); outline: none; }
  #composer .btn { border-radius: 999px; }
  .icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.rec { background: #e11d48; border-color: #e11d48; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(225, 29, 72, .25); } }
  @media (prefers-reduced-motion: reduce) { .icon-btn.rec { animation: none; } }
  #recInfo { flex: 1; color: #e11d48; font-weight: 600; padding: 0 .5rem; }

  @media (max-width: 640px) { #app { grid-template-columns: 1fr; } aside { display: none; } .row { max-width: 88%; } }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Rejoindre le chat</h1>
    <p>Choisissez un pseudo pour commencer.</p>
    <input id="nameInput" maxlength="20" placeholder="Votre pseudo" autocomplete="off" aria-label="Pseudo" autofocus>
    <p id="err" role="alert"></p>
    <button class="btn" type="submit">Rejoindre</button>
  </form>
</div>

<div id="app">
  <aside>
    <h2>En ligne (<span id="count">0</span>)</h2>
    <ul id="users"></ul>
    <p class="status" id="status">Connecté</p>
  </aside>
  <main>
    <div id="messages" aria-live="polite"></div>
    <div id="typing"></div>
    <form id="composer">
      <button type="button" id="micBtn" class="icon-btn" aria-label="Enregistrer un message vocal">🎤</button>
      <button type="button" id="cancelBtn" class="icon-btn" aria-label="Annuler l'enregistrement" hidden>✕</button>
      <input id="text" maxlength="1000" placeholder="Écrire un message" autocomplete="off" aria-label="Message">
      <div id="recInfo" hidden>● Enregistrement… <span id="recTime">0:00</span></div>
      <button class="btn" type="submit">Envoyer</button>
    </form>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws, myName = "", lastTypingSent = 0;
  const typers = new Map();

  function connect(onOpen) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = onOpen;
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => {
      $("status").textContent = "Déconnecté, reconnexion…";
      if (myName) setTimeout(() => connect(() => ws.send(JSON.stringify({ type: "join", name: myName }))), 2000);
    };
  }

  function handle(m) {
    if (m.type === "error") $("err").textContent = m.text;
    if (m.type === "joined") {
      myName = m.name;
      $("login").style.display = "none";
      $("app").style.display = "grid";
      $("status").textContent = "Connecté";
      $("messages").innerHTML = "";
      m.history.forEach(addMessage);
      $("text").focus();
    }
    if (m.type === "message" || m.type === "voice") { addMessage(m); typers.delete(m.name); renderTyping(); }
    if (m.type === "system") addSystem(m.text);
    if (m.type === "users") {
      $("count").textContent = m.users.length;
      $("users").innerHTML = "";
      m.users.forEach((u) => { const li = document.createElement("li"); li.append(avatar(u), u + (u === myName ? " (vous)" : "")); $("users").appendChild(li); });
    }
    if (m.type === "typing") {
      clearTimeout(typers.get(m.name));
      typers.set(m.name, setTimeout(() => { typers.delete(m.name); renderTyping(); }, 2000));
      renderTyping();
    }
  }

  function scrollDown() { const b = $("messages"); b.scrollTop = b.scrollHeight; }

  const hue = (n) => [...n].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);

  function avatar(name) {
    const a = document.createElement("div");
    a.className = "av";
    a.style.setProperty("--h", hue(name));
    a.textContent = name[0].toUpperCase();
    return a;
  }

  function addMessage(m) {
    const row = document.createElement("div");
    row.className = "row" + (m.name === myName ? " me" : "");
    row.style.setProperty("--h", hue(m.name));
    const bubble = document.createElement("div");
    bubble.className = "msg";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = m.name;
    const t = document.createElement("time");
    t.textContent = new Date(m.time).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    meta.appendChild(t);
    bubble.appendChild(meta);
    if (m.audio) {
      const a = document.createElement("audio");
      a.controls = true;
      a.preload = "metadata";
      a.src = m.audio;
      bubble.appendChild(a);
    } else {
      const body = document.createElement("div");
      body.textContent = m.text; // textContent : pas d'injection HTML
      bubble.appendChild(body);
    }
    row.append(avatar(m.name), bubble);
    $("messages").appendChild(row);
    scrollDown();
  }

  function addSystem(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = text;
    $("messages").appendChild(d);
    scrollDown();
  }

  function renderTyping() {
    const names = [...typers.keys()];
    $("typing").textContent = names.length === 0 ? "" :
      names.length === 1 ? `${names[0]} est en train d'écrire…` : "Plusieurs personnes écrivent…";
  }

  // ---------- Messages vocaux ----------
  let recorder, chunks = [], recStart = 0, recTick, recCancelled = false;
  const MAX_SECONDS = 60;

  function setRecUI(on) {
    $("micBtn").classList.toggle("rec", on);
    $("micBtn").textContent = on ? "⏹" : "🎤";
    $("micBtn").setAttribute("aria-label", on ? "Envoyer le vocal" : "Enregistrer un message vocal");
    $("cancelBtn").hidden = !on;
    $("recInfo").hidden = !on;
    $("text").hidden = !on ? false : true;
    if (on) $("recTime").textContent = "0:00";
  }

  async function startRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      return alert("Votre navigateur ne gère pas l'enregistrement audio.");
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return alert("Autorisez l'accès au micro pour envoyer un vocal."); }

    chunks = [];
    recCancelled = false;
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTick);
      setRecUI(false);
      if (recCancelled) return;
      const seconds = (Date.now() - recStart) / 1000;
      if (seconds < 1) return; // trop court, ignoré
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 1000000) return alert("Ce vocal est trop long.");
      const reader = new FileReader();
      reader.onload = () => {
        if (ws.readyState === 1) ws.send(JSON.stringify({ type: "voice", audio: reader.result }));
      };
      reader.readAsDataURL(blob);
    };

    recorder.start();
    recStart = Date.now();
    setRecUI(true);
    recTick = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $("recTime").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      if (s >= MAX_SECONDS) recorder.stop();
    }, 250);
  }

  $("micBtn").addEventListener("click", () => {
    if (recorder && recorder.state === "recording") recorder.stop();
    else startRec();
  });

  $("cancelBtn").addEventListener("click", () => {
    recCancelled = true;
    if (recorder && recorder.state === "recording") recorder.stop();
  });

  // ---------- Connexion et messages texte ----------
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    $("err").textContent = "";
    const name = $("nameInput").value.trim();
    if (!name) return ($("err").textContent = "Entrez un pseudo.");
    const join = () => ws.send(JSON.stringify({ type: "join", name }));
    if (ws && ws.readyState === 1) join(); else connect(join);
  });

  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "message", text }));
    $("text").value = "";
  });

  $("text").addEventListener("input", () => {
    const now = Date.now();
    if (now - lastTypingSent > 1000 && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "typing" }));
      lastTypingSent = now;
    }
  });

  connect(() => {});
</script>
</body>
</html>
